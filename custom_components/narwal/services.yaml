clean_zone:
  name: Clean zone
  description: >-
    Clean one or more rectangular zones drawn on the map. The 'coordinates'
    field selects how the values are interpreted — by default they are
    map-image pixels of the 1:1 camera (the pre-1.6 contract). Set
    coordinates to 'world' for robot world/map-frame values (what the
    xiaomi-vacuum-map-card sends as [[selection]] with calibration_source
    camera, using the Map HD camera's calibration_points attribute).
    Corner order does not matter. The robot must be docked.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    zone:
      name: Zone(s)
      description: >-
        List of rectangles, each [x1, y1, x2, y2] — interpreted per the
        'coordinates' field (map-image pixels by default, or robot world
        values, e.g. the xiaomi-vacuum-map-card [[selection]]).
      required: false
      example: "[[26, 24, 76, 76]]"
      selector: {object: {}}
    x1:
      name: X1
      description: Single-rectangle first corner X (see 'coordinates'). Use when 'zone' is omitted.
      required: false
      example: 26
      selector: {number: {min: -4000, max: 4000, mode: box}}
    y1:
      name: Y1
      description: Single-rectangle first corner Y (see 'coordinates').
      required: false
      example: 24
      selector: {number: {min: -4000, max: 4000, mode: box}}
    x2:
      name: X2
      description: Single-rectangle opposite corner X (see 'coordinates').
      required: false
      example: 76
      selector: {number: {min: -4000, max: 4000, mode: box}}
    y2:
      name: Y2
      description: Single-rectangle opposite corner Y (see 'coordinates').
      required: false
      example: 76
      selector: {number: {min: -4000, max: 4000, mode: box}}
    fan_speed:
      name: Fan speed
      description: Optional suction level.
      required: false
      example: normal
      selector: {select: {options: [quiet, normal, strong, max]}}
    coordinates:
      name: Coordinate system
      description: >-
        How to interpret the rectangle values. "pixels" (default) = map-image
        pixels of the 1:1 camera — the pre-1.6 contract, kept for backwards
        compatibility; "world" = robot world/map frame (the new mode, what the
        map card sends with camera calibration); "auto" = detect from the
        values. 2.0.0 will drop the pixel contract and default to world.
      required: false
      default: pixels
      example: world
      selector: {select: {options: [auto, world, pixels]}}

clean_rooms:
  name: Clean rooms
  description: >-
    Clean specific rooms by segment id in the currently selected clean mode,
    via clean/start_clean. The robot must be docked.
  target:
    entity:
      integration: narwal
      domain: vacuum
  fields:
    rooms:
      name: Room segment ids
      description: List of room segment ids (from vacuum/get_segments).
      required: true
      example: "[6]"
      selector: {object: {}}

resume:
  name: Resume
  description: >-
    Resume the current task via task/resume, regardless of the reported
    vacuum state. Use to un-stick a robot paused by a false "robot lifted"
    error (e.g. on a doormat) even when the entity state lags behind.
    Safe to call anytime — the robot rejects it when there is nothing
    to resume.
  target:
    entity:
      integration: narwal
      domain: vacuum
