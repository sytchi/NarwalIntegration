name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Features"
    labels: [feature, enhancement]
  - title: "🐛 Fixes"
    labels: [fix, bug]
  - title: "🧰 Maintenance"
    labels: [chore, dependencies, documentation]
autolabeler:
  - label: feature
    title: ["/^feat/i"]
  - label: fix
    title: ["/^fix/i"]
  - label: chore
    title: ["/^(chore|ci|docs|refactor|test)/i"]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
version-resolver:
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bug, chore, dependencies, documentation]
  default: patch
template: |
  ## What's changed

  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/blob/master/CHANGELOG.md
